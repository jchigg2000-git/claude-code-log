<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="description" content="A local, read-only dashboard for browsing and analyzing your Claude Code history across every repo on your machine." />
    <title>Claude Code Log</title>
  </head>
  <body>
    <header class="topbar">
      <a href="#/" class="brand">Claude&nbsp;Code&nbsp;Log</a>
      <nav class="nav">
        <a href="#/" data-route="repos">Repos</a>
        <a href="#/viz" data-route="viz">Data Viz</a>
        <a href="#/journey" data-route="journey">Journey</a>
        <a href="#/words" data-route="words">Words</a>
        <a href="#/profile" data-route="profile">Profile</a>
      </nav>
      <input
        id="search-box"
        class="search-box"
        type="search"
        placeholder="Search all transcripts…"
        aria-label="Search all transcripts"
        autocomplete="off"
        spellcheck="false"
      />
      <button id="settings-btn" class="gear" title="Settings" aria-label="Settings">⚙</button>
    </header>
    <main id="app"></main>
    <div id="modal-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
