name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit SHA, not a floating tag: on a public repo a moved tag
      # is a supply-chain rewrite of CI that no diff here would show. Dependabot
      # (.github/dependabot.yml) proposes the bumps as reviewable PRs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node 24+ is a hard requirement, not a preference: the suite runs the
      # TypeScript sources directly via `node --test test/*.test.ts`, which
      # needs native type-stripping.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Also runs the typecheck, so this proves the bundle builds on top of it.
      - name: Build
        run: npm run build

      # The app's own pitch is a contained, read-only surface; a shipped
      # advisory in the dev server undercuts it. Production deps must be clean.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
